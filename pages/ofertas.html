<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofertas Exclusivas · Urban Kicks</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { beige: '#F5F0ED', black: '#0f0f0f', accent: '#D49A89', gold: '#c9a84c', darkBg: '#000000', darkCard: '#111111' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Oswald', 'sans-serif'] }
                }
            }
        }
    </script>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-brand-beige dark:bg-brand-darkBg overflow-x-hidden font-sans text-gray-800 dark:text-gray-100 transition-colors duration-500 min-h-screen flex flex-col" id="body-bg">

    <!-- ===== CONTENIDO ÚNICO DE OFERTAS ===== -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-6 pt-32 pb-20">
        <div class="mb-12">
            <h1 class="font-display text-4xl md:text-6xl font-bold text-brand-black dark:text-white uppercase tracking-widest">Ofertas Exclusivas</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-2 uppercase tracking-wider text-sm">Aprovecha los descuentos especiales por tiempo limitado</p>
        </div>

        <!-- Contenedor dinámico de productos -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="category-products">
            <!-- Los productos se inyectan dinámicamente mediante JS -->
        </div>
    </main>

    <!-- ===== SCRIPTS ===== -->
    <script src="../js/layout.js"></script>
    <script src="../js/zofertas.js"></script>
</body>
</html>
